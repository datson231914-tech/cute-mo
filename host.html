<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bong Bóng Lời Chúc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ocean.css">
<style>
  /* ---------- Bảng QR (trước khi thả) ---------- */
  .panel {
    position: fixed; left: 50%; top: 50%; z-index: 5;
    transform: translate(-50%, -50%);
    width: min(620px, 92vw); max-height: 96vh;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: clamp(18px, 2.5vh, 32px) clamp(24px, 3vw, 44px);
    border-radius: 32px;
    background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: 0 30px 80px rgba(0, 20, 50, .45), inset 0 1px 0 rgba(255,255,255,.4);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    transition: opacity .9s ease, transform .9s cubic-bezier(.6,-0.3,.4,1.2);
  }
  .released .panel { opacity: 0; transform: translate(-50%, -30%) scale(.85); pointer-events: none; }

  .qr-box {
    position: relative;
    background: #fff; border-radius: 24px; padding: 14px;
    box-shadow: 0 0 0 6px rgba(127,227,255,.35), 0 18px 40px rgba(0,0,0,.3);
  }
  .qr-box .qr { width: min(40vh, 360px); height: min(40vh, 360px); display: block; }
  .qr-box .qr svg { width: 100%; height: 100%; display: block; }
  .url { margin-top: 12px; text-align: center; font-size: 14px; opacity: .8; word-break: break-all; max-width: min(42vh, 340px) }

  .eyebrow { font-size: clamp(14px, 1.3vw, 18px); letter-spacing: .14em; text-transform: uppercase; color: var(--aqua); font-weight: 600; }
  .title {
    font-family: var(--font-title); font-weight: 700;
    font-size: clamp(36px, 6vh, 72px); line-height: 1.05; margin: 4px 0 14px;
    text-shadow: 0 4px 24px rgba(0, 40, 80, .6), 0 0 40px rgba(127,227,255,.35);
  }
  .hint { font-size: clamp(15px, 1.4vw, 20px); opacity: .9; margin: 0 0 22px; line-height: 1.5; }

  .counter { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 14px; }
  .counter b { font-size: clamp(32px, 5vh, 56px); font-weight: 700; line-height: 1; color: #fff; text-shadow: 0 0 24px rgba(127,227,255,.6); }
  .counter span { font-size: clamp(16px, 1.5vw, 22px); opacity: .85; }
  .bar { height: 14px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; margin-bottom: 26px; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, #7fe3ff, #c8f7ff, #7fe3ff); background-size: 200% 100%;
    animation: barFlow 3s linear infinite; transition: width .6s ease;
  }
  @keyframes barFlow { to { background-position: -200% 0; } }

  .release {
    font: 700 clamp(18px, 1.8vw, 24px) var(--font-body); color: #023154;
    padding: 18px 34px; border: 0; border-radius: 99px; cursor: pointer;
    background: radial-gradient(circle at 30% 20%, #ffffff, #bff3ff 45%, #66d4f5);
    box-shadow: 0 10px 30px rgba(102, 212, 245, .55), inset 0 -4px 0 rgba(0,60,100,.15);
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .release:hover { transform: translateY(-2px) scale(1.03); }
  .release:active { transform: scale(.97); }
  .release:disabled { opacity: .5; cursor: not-allowed; animation: none; }
  @keyframes breathe { 50% { box-shadow: 0 10px 50px rgba(150, 235, 255, .9), inset 0 -4px 0 rgba(0,60,100,.15); } }
  .key-hint { margin-top: 12px; font-size: 13px; opacity: .6; }

  /* ---------- Sau khi thả ---------- */
  .top-title {
    position: fixed; top: 4vh; left: 0; right: 0; z-index: 4; text-align: center;
    font-family: var(--font-title); font-weight: 700; font-size: clamp(40px, 5vw, 76px);
    text-shadow: 0 4px 24px rgba(0, 40, 80, .7), 0 0 40px rgba(127,227,255,.45);
    opacity: 0; transform: translateY(-30px); transition: all 1.2s ease .6s; pointer-events: none;
  }
  .released .top-title { opacity: 1; transform: none; }

  .corner {
    position: fixed; right: 22px; bottom: 22px; z-index: 6;
    display: flex; gap: 14px; align-items: center;
    padding: 12px 16px 12px 12px; border-radius: 20px;
    background: rgba(2, 30, 60, .55); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; transform: translateY(30px); transition: all .8s ease 1s; pointer-events: none;
  }
  .released .corner { opacity: 1; transform: none; pointer-events: auto; }
  .corner .qr { width: 110px; height: 110px; background: #fff; border-radius: 10px; padding: 6px; }
  .corner .qr svg { width: 100%; height: 100%; display: block; }
  .corner p { margin: 0; font-size: 14px; line-height: 1.5; }
  .corner b { font-size: 22px; }

  /* ---------- Bong bóng lời chúc ---------- */
  .stage {
    position: fixed; inset: 0; z-index: 3; overflow: hidden; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 20%);
  }
  .bubble {
    position: absolute; top: 100%; pointer-events: auto; cursor: pointer;
    animation: rise var(--dur) linear forwards;
    will-change: transform;
  }
  @keyframes rise { to { transform: translateY(calc(-100vh - 100% - 60px)); } }
  .bubble-sway { animation: sway var(--sw) ease-in-out infinite alternate; }
  @keyframes sway { from { transform: translateX(calc(var(--amp) * -1)); } to { transform: translateX(var(--amp)); } }
  .ball {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 15%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.55), rgba(255,255,255,.06) 22%, transparent 45%),
      radial-gradient(circle at 72% 82%, rgba(127,227,255,.30), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(80,170,230,.10), rgba(160,230,255,.22) 70%, rgba(255,255,255,.35) 100%);
    border: 1.5px solid rgba(255,255,255,.55);
    box-shadow:
      inset 10px 12px 28px rgba(255, 170, 235, .22),
      inset -12px -16px 30px rgba(110, 220, 255, .30),
      0 0 24px rgba(150, 230, 255, .25);
    animation: wobble var(--wb) ease-in-out infinite alternate;
  }
  .ball::after {
    content: ""; position: absolute; left: 20%; top: 12%; width: 22%; height: 12%;
    border-radius: 50%; background: rgba(255,255,255,.75); filter: blur(1px); transform: rotate(-30deg);
  }
  @keyframes wobble { from { transform: scale(1, 1); } to { transform: scale(1.04, .96); } }
  .ball .wish {
    margin: 0; font-weight: 600; line-height: 1.32; color: #fff;
    text-shadow: 0 1px 3px rgba(0, 25, 60, .9), 0 0 12px rgba(0, 40, 90, .6);
    overflow-wrap: anywhere; flex-shrink: 0;
  }
  .ball .from {
    margin-top: 6px; font-family: var(--font-title); font-weight: 700; color: #c8f7ff;
    text-shadow: 0 1px 3px rgba(0, 25, 60, .9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; flex-shrink: 0;
  }
  .bubble.fresh .ball { border-color: rgba(255, 230, 150, .9); box-shadow: inset 10px 12px 28px rgba(255, 210, 120, .3), inset -12px -16px 30px rgba(110, 220, 255, .3), 0 0 36px rgba(255, 220, 140, .55); }
  .bubble.popping { animation-play-state: paused; }
  .bubble.popping .ball { animation: pop .35s ease-out forwards; }
  @keyframes pop { to { transform: scale(1.35); opacity: 0; } }

  /* ---------- Đọc lời chúc phóng to ---------- */
  .reader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: rgba(1, 18, 40, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .reader.show { opacity: 1; pointer-events: auto; }
  .reader .card {
    width: min(760px, 88vw); padding: 48px 56px; border-radius: 32px; text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.4); box-shadow: 0 30px 80px rgba(0,0,0,.4);
    transform: scale(.9); transition: transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .reader.show .card { transform: none; }
  .reader .card p { font-size: clamp(24px, 3vw, 40px); line-height: 1.45; margin: 0 0 20px; white-space: pre-line; }
  .reader .card span { font-family: var(--font-title); font-size: clamp(28px, 3vw, 42px); color: var(--aqua); }

  /* ---------- Thông báo & nút ---------- */
  .toasts { position: fixed; left: 22px; bottom: 22px; z-index: 7; display: flex; flex-direction: column-reverse; gap: 8px; pointer-events: none; }
  .toast {
    padding: 10px 16px; border-radius: 99px; font-size: 15px;
    background: rgba(2, 30, 60, .6); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: toastIn .4s ease, toastOut .6s ease 4.4s forwards;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-20px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

  .tools { position: fixed; top: 16px; right: 16px; z-index: 8; display: flex; gap: 8px; opacity: .35; transition: opacity .3s; }
  .tools:hover { opacity: 1; }
  .tools button {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(2,30,60,.5); color: #fff; font-size: 18px; cursor: pointer;
  }
  .net { position: fixed; top: 16px; left: 16px; z-index: 8; font-size: 13px; padding: 6px 12px; border-radius: 99px; background: rgba(160, 30, 40, .7); display: none; }
  .net.show { display: block; }

  @media (max-width: 820px) {
    .panel { grid-template-columns: 1fr; justify-items: center; text-align: center; top: 50%; max-height: 94vh; overflow: auto; }
    .counter { justify-content: center; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <section class="panel" id="panel">
    <div class="eyebrow">🌊 Quét mã QR để gửi lời chúc</div>
    <h1 class="title" id="title">Gửi Lời Chúc</h1>
    <div class="qr-box"><div class="qr" id="qrBig"></div></div>
    <div class="url" id="url"></div>
    <div class="counter"><b id="count">0</b><span>/ <span id="max">200</span> lời chúc</span></div>
    <button class="release" id="release" disabled>▶ Play</button>
  </section>

  <div class="top-title" id="topTitle"></div>


  <div class="reader" id="reader"><div class="card"><p id="readerText"></p><span id="readerName"></span></div></div>
  <div class="toasts" id="toasts"></div>
  <div class="net" id="net">⚠ Mất kết nối máy chủ…</div>
  <div class="tools"><button id="fs" title="Toàn màn hình (F)">⛶</button></div>

<script src="/qr.js"></script>
<script src="/ocean.js"></script>
<script>
(() => {
  Ocean.build();

  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);

  const all = new Map();       // id -> wish
  let lastId = 0;
  let max = 200;
  let released = false;
  let firstLoad = true;

  // ---------- Thông tin & mã QR ----------
  async function init() {
    const info = await fetch("/api/info").then((r) => r.json());
    max = info.max;
    $("title").textContent = info.title;
    $("topTitle").textContent = info.title;
    document.title = info.title + " · Bong bóng lời chúc";
    $("max").textContent = max;

    const override = new URLSearchParams(location.search).get("url");
    const isLocal = ["localhost", "127.0.0.1", "::1", "[::1]"].includes(location.hostname);
    let base = override || info.publicUrl || (isLocal ? info.lanUrl : location.origin);
    base = base.replace(/\/+$/, "");
    const guestUrl = /\/guest$/.test(base) ? base : base + "/guest";

    const svg = QR.toSVG(guestUrl, { ecl: "M", margin: 1, dark: "#03264a" });
    $("qrBig").innerHTML = svg;
    $("url").textContent = guestUrl;
  }

  // ---------- Lấy lời chúc mới ----------
  async function poll() {
    try {
      const data = await fetch("/api/wishes?since=" + lastId, { cache: "no-store" }).then((r) => r.json());
      $("net").classList.remove("show");
      max = data.max;
      for (const w of data.wishes) {
        if (all.has(w.id)) continue;
        all.set(w.id, w);
        lastId = Math.max(lastId, w.id);
        if (!firstLoad) onNewWish(w);
      }
      firstLoad = false;
      updateCounter();
    } catch {
      $("net").classList.add("show");
    }
    setTimeout(poll, 2000);
  }

  function updateCounter() {
    const n = all.size;
    $("count").textContent = n;
    $("release").disabled = n === 0;
    $("release").textContent = n === 0 ? "Đang chờ lời chúc…" : "▶ Play";
  }

  function onNewWish(w) {
    toast(`🫧 <b></b> vừa gửi lời chúc`, w.name);
    if (released) priority.push(w);
  }

  function toast(html, name) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = html;
    t.querySelector("b").textContent = name;
    $("toasts").appendChild(t);
    while ($("toasts").children.length > 4) $("toasts").firstChild.remove();
    setTimeout(() => t.remove(), 5200);
  }

  // ---------- Thả bong bóng ----------
  const stage = $("stage");
  let queue = [];
  const priority = [];
  const live = [];             // bong bóng đang bay: {el, id, x, size, amp, born, speed}
  let nextAllowed = 0;
  let burstLeft = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function peekWish() {
    if (priority.length) return { w: priority[0], fresh: true };
    if (!queue.length) {
      const onScreen = new Set(live.map((b) => b.id));
      queue = shuffle([...all.values()].filter((w) => !onScreen.has(w.id)));
      if (!queue.length) return null;   // tất cả đều đang bay
    }
    return { w: queue[0], fresh: false };
  }
  function takeWish(fresh) { return fresh ? priority.shift() : queue.shift(); }

  const viewScale = () => Math.max(0.62, Math.min(1.3, Math.min(innerWidth / 1500, innerHeight / 850)));
  function bubbleSize(text) {
    const len = Array.from(text).length;
    return Math.round((150 + Math.min(1, len / 150) * 120) * viewScale());
  }
  // Mọi bong bóng bay cùng tốc độ → không bao giờ đuổi kịp nhau
  const speed = () => innerHeight / 14;   // px mỗi giây

  // Tìm vị trí x không đè lên bong bóng nào vẫn còn ở vùng đáy
  function findX(size, amp) {
    const W = innerWidth, H = innerHeight, now = performance.now();
    const gapY = 24 * viewScale();
    const blockers = live.filter((b) => {
      const top = H - ((now - b.born) / 1000) * b.speed;
      return top + b.size + gapY > H;
    });
    const minX = W * 0.015 + amp, maxX = W * 0.985 - size - amp;
    for (let i = 0; i < 30; i++) {
      const x = rand(minX, Math.max(minX, maxX));
      const ok = blockers.every((b) =>
        Math.abs((x + size / 2) - (b.x + b.size / 2)) > (size + b.size) / 2 + amp + b.amp + 10);
      if (ok) return x;
    }
    return null;
  }

  function targetCount() {
    const avg = 210 * viewScale();
    return Math.max(7, Math.min(28, Math.round((innerWidth * innerHeight) / (avg * avg * 1.5))));
  }

  function tick() {
    const now = performance.now();
    if (released && !document.hidden && all.size && now >= nextAllowed && live.length < targetCount()) {
      if (spawn()) {
        nextAllowed = now + (burstLeft > 0 ? (burstLeft--, rand(150, 350)) : rand(300, 900));
      } else {
        nextAllowed = now + 300;
      }
    }
    setTimeout(tick, 120);
  }

  function spawn() {
    const next = peekWish();
    if (!next) return false;
    const w = next.w, fresh = next.fresh;
    const size = bubbleSize(w.text);
    const amp = Math.round(rand(10, 24) * viewScale());
    const x = findX(size, amp);
    if (x === null) return false;
    takeWish(fresh);

    const len = Array.from(w.text).length;
    const font = Math.max(12, Math.round(size * (len < 40 ? 0.1 : len < 90 ? 0.083 : 0.07)));
    const sp = speed();
    const dur = (innerHeight + size + 60) / sp;

    const b = document.createElement("div");
    b.className = "bubble" + (fresh ? " fresh" : "");
    b.style.width = b.style.height = size + "px";
    b.style.left = x + "px";
    b.style.setProperty("--dur", dur.toFixed(2) + "s");
    b.style.setProperty("--sw", rand(2.8, 4.5).toFixed(1) + "s");
    b.style.setProperty("--amp", amp + "px");
    b.style.setProperty("--wb", rand(1.6, 2.6).toFixed(1) + "s");
    const rec = { el: b, id: w.id, x, size, amp, born: performance.now(), speed: sp };
    live.push(rec);
    const forget = () => { const i = live.indexOf(rec); if (i >= 0) live.splice(i, 1); };

    b.innerHTML = `<div class="bubble-sway" style="width:100%;height:100%"><div class="ball"><p class="wish"></p><div class="from"></div></div></div>`;
    const p = b.querySelector(".wish");
    p.textContent = w.text;
    p.style.fontSize = font + "px";
    const from = b.querySelector(".from");
    from.textContent = "— " + w.name;
    from.style.fontSize = Math.round(font * 1.15) + "px";

    b.addEventListener("animationend", (e) => { if (e.animationName === "rise") { forget(); b.remove(); } });
    b.addEventListener("click", () => { forget(); openReader(b, w); });
    stage.appendChild(b);
    fitText(p, from, size, font);
    return true;
  }

  // Thu nhỏ chữ đến khi lời chúc nằm gọn trong bong bóng
  function fitText(p, from, size, font) {
    const room = size * 0.7;
    for (let f = font; f >= 11; f--) {
      p.style.fontSize = f + "px";
      from.style.fontSize = Math.round(f * 1.15) + "px";
      if (p.scrollHeight + from.offsetHeight + 6 <= room && from.scrollWidth <= from.clientWidth + 1) break;
    }
  }

  function release() {
    if (released || !all.size) return;
    released = true;
    document.body.classList.add("released");
    queue = shuffle([...all.values()]);
    burstLeft = 10;                       // đợt đầu bung ra thật nhanh
    nextAllowed = performance.now() + 500;
  }

  // ---------- Đọc lời chúc ----------
  let readerTimer;
  function openReader(b, w) {
    if (b.classList.contains("popping")) return;
    b.classList.add("popping");
    setTimeout(() => b.remove(), 360);
    $("readerText").textContent = w.text;
    $("readerName").textContent = "— " + w.name;
    $("reader").classList.add("show");
    clearTimeout(readerTimer);
    readerTimer = setTimeout(closeReader, 9000);
  }
  function closeReader() { $("reader").classList.remove("show"); }
  $("reader").addEventListener("click", closeReader);

  // ---------- Điều khiển ----------
  $("release").addEventListener("click", release);
  function toggleFS() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
  $("fs").addEventListener("click", toggleFS);
  addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); release(); }
    if (e.key === "f" || e.key === "F") toggleFS();
    if (e.key === "Escape") closeReader();
  });

  init().catch(() => $("net").classList.add("show")).finally(poll);
  tick();
})();
</script>
</body>
</html>
